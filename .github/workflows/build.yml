name: Build

# 说明：macOS runner 按 10 倍计费（1 分钟 = 10 额度分钟），
# 免费额度很容易被一次完整构建吃光。
# 所以这里的 CI 只做**静态检查**（十几秒），真正的构建在本地跑 build.sh。
#
# 想恢复完整构建：把 `runs-on: ubuntu-latest` 换成 `macos-14`，
# 并取消下面 `Build app` 步骤的注释。前提是 Actions 额度充足。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: 结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查必需文件
        run: |
          set -e
          required=(LICENSE README.md CONTRIBUTING.md SECURITY.md build.sh)
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少必需文件 $f"
              exit 1
            fi
            echo "✓ $f"
          done

      - name: 检查 Swift 源码
        run: |
          set -e
          count=$(find Sources -name '*.swift' | wc -l | tr -d ' ')
          echo "Swift 文件: $count 个"
          if [ "$count" -lt 5 ]; then
            echo "::error::Swift 文件数量异常（$count）"
            exit 1
          fi

      - name: 检查 Info.plist
        run: |
          set -e
          if ! grep -q "CFBundleExecutable" App/Info.plist; then
            echo "::error::Info.plist 缺少 CFBundleExecutable"
            exit 1
          fi
          exe=$(grep -A1 "CFBundleExecutable" App/Info.plist | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/' | tr -d ' \t')
          echo "CFBundleExecutable = $exe"
          if [ ! -f "Sources/XianzhuDSHConnect/main.swift" ]; then
            echo "::error::找不到 main.swift"
            exit 1
          fi

      - name: 检查没有残留的个人路径
        run: |
          if grep -rn "/Users/[a-zA-Z0-9]*/" Sources/ 2>/dev/null | grep -v "serenity" | head -5; then
            echo "::warning::源码中可能有硬编码路径，请确认"
          fi
          if grep -rn "/Users/serenity" Sources/ 2>/dev/null | head -5; then
            echo "::error::源码中包含开发者个人路径"
            exit 1
          fi
          echo "✓ 无个人路径残留"

      - name: 检查 shell 脚本语法
        run: |
          bash -n build.sh
          echo "✓ build.sh 语法正确"
          for f in dist/*.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "✓ $f"
          done

  # 本地构建用：
  #   ./build.sh --no-llama
  #
  # 需要 CI 构建时，改用 macos-14 runner（注意额度消耗）：
  #
  # build:
  #   name: Build (Apple Silicon)
  #   runs-on: macos-14
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: ./build.sh --no-llama
  #     - run: test -x "build/XianzhuDSHConnect.app/Contents/MacOS/XianzhuDSHConnect"
